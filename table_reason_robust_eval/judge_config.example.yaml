input_paths:
  - "outputs/aida_qa/predictions_example.jsonl"

model:
  base_url: "${JUDGE_BASE_URL}"
  api_key: "${JUDGE_API_KEY}"
  name: "your-judge-model"
  request_timeout: 120
  max_retries: 2

runner:
  num_workers: 2
  limit: null
  stall_timeout_sec: 600
  log_level: "info"

judge:
  prompt_path: "prompts/judge_refusal.md"
  skip_completed: true
